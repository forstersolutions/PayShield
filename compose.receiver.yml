name: payshield-receiver

services:
  waitlist-receiver:
    build:
      context: .
      dockerfile: Dockerfile.receiver
    image: payshield-waitlist-receiver:production
    init: true
    restart: unless-stopped
    ports:
      - "${PAYSHIELD_RECEIVER_HOST_PORT:-8787}:8787"
    environment:
      NODE_ENV: production
      PAYSHIELD_RECEIVER_DATA_DIR: /data/waitlist
      PAYSHIELD_RECEIVER_HEALTH_PATH: /health
      PAYSHIELD_RECEIVER_PATH: /payshield-waitlist
      PAYSHIELD_WAITLIST_WEBHOOK_SECRET: ${PAYSHIELD_WAITLIST_WEBHOOK_SECRET:?Set PAYSHIELD_WAITLIST_WEBHOOK_SECRET in .env.receiver}
    volumes:
      - type: bind
        source: ${PAYSHIELD_RECEIVER_HOST_DATA_DIR:?Set PAYSHIELD_RECEIVER_HOST_DATA_DIR to a persistent host directory outside git}
        target: /data/waitlist
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
