AWSTemplateFormatVersion: "2010-09-09"
Description: PayShield production core on ECS Fargate with private RDS PostgreSQL.

Parameters:
  EnvironmentName:
    Type: String
    Default: production
    AllowedPattern: "[a-z0-9-]+"
  CoreDomainName:
    Type: String
    Description: Public DNS name for the core service, such as api.payshield.com.
  HostedZoneId:
    Type: String
    Default: ""
    Description: Optional Route 53 public hosted zone containing CoreDomainName. Leave blank when DNS is managed externally.
  CertificateArn:
    Type: String
    Description: ACM certificate ARN covering CoreDomainName in this region.
  ContainerImageTag:
    Type: String
    Default: bootstrap
    AllowedPattern: "[A-Za-z0-9_.-]+"
  DesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 8
  DatabaseName:
    Type: String
    Default: payshield
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]+"
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.small
  AlertEmail:
    Type: String
    Default: support@graystontechnologies.com
  PlaidEnvironment:
    Type: String
    Default: sandbox
    AllowedValues: [sandbox, development, production]
  PlaidClientIdSecretArn:
    Type: String
    Default: ""
    Description: Optional Secrets Manager ARN containing only the Plaid client ID.
  PlaidSecretArn:
    Type: String
    Default: ""
    Description: Optional Secrets Manager ARN containing only the Plaid secret.
  BaasProvider:
    Type: String
    Default: ""
  BaasApiBaseUrl:
    Type: String
    Default: ""
  BaasApiKeySecretArn:
    Type: String
    Default: ""
    Description: Optional Secrets Manager ARN containing only the provider API key.
  BaasContractApproved:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  SponsorDisclosuresApproved:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  RegulatedCounselSignoff:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  OperationsRunbooksApproved:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  FrontendAuthVerified:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  TransferEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  LiveMoneyEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  LedgerSchemaFingerprint:
    Type: String
    Default: 886ba3ecae8a263f87afe42e61b6d884180c0dd647ced93b9b06bfc9eefd6f4f

Conditions:
  HasHostedZone: !Not [!Equals [!Ref HostedZoneId, ""]]
  HasPlaidClientIdSecret: !Not [!Equals [!Ref PlaidClientIdSecretArn, ""]]
  HasPlaidSecret: !Not [!Equals [!Ref PlaidSecretArn, ""]]
  HasBaasApiKeySecret: !Not [!Equals [!Ref BaasApiKeySecretArn, ""]]

Resources:
  DataKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub PayShield ${EnvironmentName} data encryption key
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: "kms:*"
            Resource: "*"
          - Sid: CloudWatchLogsEncryption
            Effect: Allow
            Principal:
              Service: !Sub logs.${AWS::Region}.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:ReEncryptFrom
              - kms:ReEncryptTo
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/payshield/${EnvironmentName}/core*
      Tags:
        - Key: application
          Value: payshield
        - Key: environment
          Value: !Ref EnvironmentName

  DataKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/payshield-${EnvironmentName}
      TargetKeyId: !Ref DataKey

  CoreServiceTokenSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: PayShield Vercel-to-core bearer token
      Name: !Sub payshield/${EnvironmentName}/core-service-token
      KmsKeyId: !Ref DataKey
      GenerateSecretString:
        ExcludePunctuation: true
        PasswordLength: 64
      Tags:
        - Key: application
          Value: payshield
        - Key: environment
          Value: !Ref EnvironmentName

  TokenVaultEncryptionSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: PayShield token vault AES-256 key material
      Name: !Sub payshield/${EnvironmentName}/token-vault-encryption-key
      KmsKeyId: !Ref DataKey
      GenerateSecretString:
        ExcludePunctuation: true
        PasswordLength: 32
      Tags:
        - Key: application
          Value: payshield
        - Key: environment
          Value: !Ref EnvironmentName

  TokenVaultWebhookSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: PayShield token vault HMAC secret
      Name: !Sub payshield/${EnvironmentName}/token-vault-webhook-secret
      KmsKeyId: !Ref DataKey
      GenerateSecretString:
        ExcludePunctuation: true
        PasswordLength: 64
      Tags:
        - Key: application
          Value: payshield
        - Key: environment
          Value: !Ref EnvironmentName

  ProviderWebhookSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: PayShield provider callback HMAC secret
      Name: !Sub payshield/${EnvironmentName}/provider-webhook-secret
      KmsKeyId: !Ref DataKey
      GenerateSecretString:
        ExcludePunctuation: true
        PasswordLength: 64
      Tags:
        - Key: application
          Value: payshield
        - Key: environment
          Value: !Ref EnvironmentName

  CoreVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub payshield-${EnvironmentName}

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref CoreVpc

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.42.0.0/24
      MapPublicIpOnLaunch: false
      VpcId: !Ref CoreVpc
      Tags:
        - Key: Name
          Value: !Sub payshield-${EnvironmentName}-public-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: false
      VpcId: !Ref CoreVpc
      Tags:
        - Key: Name
          Value: !Sub payshield-${EnvironmentName}-public-b

  AppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.42.10.0/24
      MapPublicIpOnLaunch: false
      VpcId: !Ref CoreVpc
      Tags:
        - Key: Name
          Value: !Sub payshield-${EnvironmentName}-app-a

  AppSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.42.11.0/24
      MapPublicIpOnLaunch: false
      VpcId: !Ref CoreVpc
      Tags:
        - Key: Name
          Value: !Sub payshield-${EnvironmentName}-app-b

  DatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.42.20.0/24
      MapPublicIpOnLaunch: false
      VpcId: !Ref CoreVpc
      Tags:
        - Key: Name
          Value: !Sub payshield-${EnvironmentName}-db-a

  DatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.42.21.0/24
      MapPublicIpOnLaunch: false
      VpcId: !Ref CoreVpc
      Tags:
        - Key: Name
          Value: !Sub payshield-${EnvironmentName}-db-b

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref CoreVpc

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetA

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetB

  NatEipA:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc

  NatEipB:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc

  NatGatewayA:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEipA.AllocationId
      SubnetId: !Ref PublicSubnetA

  NatGatewayB:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEipB.AllocationId
      SubnetId: !Ref PublicSubnetB

  AppRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref CoreVpc

  AppRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref CoreVpc

  AppDefaultRouteA:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA
      RouteTableId: !Ref AppRouteTableA

  AppDefaultRouteB:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayB
      RouteTableId: !Ref AppRouteTableB

  AppSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref AppRouteTableA
      SubnetId: !Ref AppSubnetA

  AppSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref AppRouteTableB
      SubnetId: !Ref AppSubnetB

  DatabaseRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref CoreVpc

  DatabaseSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref DatabaseRouteTable
      SubnetId: !Ref DatabaseSubnetA

  DatabaseSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref DatabaseRouteTable
      SubnetId: !Ref DatabaseSubnetB

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PayShield public ALB ingress
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 1
          ToPort: 1
          CidrIp: 127.0.0.1/32
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      VpcId: !Ref CoreVpc

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PayShield private ECS tasks
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 1
          ToPort: 1
          CidrIp: 127.0.0.1/32
      VpcId: !Ref CoreVpc

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PayShield private PostgreSQL
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 1
          ToPort: 1
          CidrIp: 127.0.0.1/32
      VpcId: !Ref CoreVpc

  LoadBalancerToAppEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      DestinationSecurityGroupId: !Ref AppSecurityGroup
      FromPort: 8080
      GroupId: !Ref LoadBalancerSecurityGroup
      IpProtocol: tcp
      ToPort: 8080

  AppFromLoadBalancerIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      FromPort: 8080
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      ToPort: 8080

  AppHttpsEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      CidrIp: 0.0.0.0/0
      FromPort: 443
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      ToPort: 443

  AppToDatabaseEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      DestinationSecurityGroupId: !Ref DatabaseSecurityGroup
      FromPort: 5432
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      ToPort: 5432

  DatabaseFromAppIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      FromPort: 5432
      GroupId: !Ref DatabaseSecurityGroup
      IpProtocol: tcp
      SourceSecurityGroupId: !Ref AppSecurityGroup
      ToPort: 5432

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: PayShield private database subnets
      SubnetIds: [!Ref DatabaseSubnetA, !Ref DatabaseSubnetB]

  DatabaseParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: PayShield PostgreSQL security settings
      Family: postgres16
      Parameters:
        rds.force_ssl: "1"
        log_connections: "1"
        log_disconnections: "1"

  DatabaseMonitoringRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub payshield-${EnvironmentName}-database-monitoring
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: monitoring.rds.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole
      Tags:
        - Key: application
          Value: payshield
        - Key: environment
          Value: !Ref EnvironmentName

  LedgerDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      AllocatedStorage: "50"
      AllowMajorVersionUpgrade: false
      AutoMinorVersionUpgrade: true
      BackupRetentionPeriod: 35
      CopyTagsToSnapshot: true
      DBInstanceClass: !Ref DatabaseInstanceClass
      DBName: !Ref DatabaseName
      DBParameterGroupName: !Ref DatabaseParameterGroup
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      DeletionProtection: true
      EnableCloudwatchLogsExports: [postgresql, upgrade]
      EnablePerformanceInsights: true
      Engine: postgres
      EngineVersion: "16.14"
      KmsKeyId: !GetAtt DataKey.Arn
      ManageMasterUserPassword: true
      MasterUserSecret:
        KmsKeyId: !GetAtt DataKey.Arn
      MasterUsername: payshield_admin
      MaxAllocatedStorage: 500
      MonitoringInterval: 60
      MonitoringRoleArn: !GetAtt DatabaseMonitoringRole.Arn
      MultiAZ: true
      PerformanceInsightsKMSKeyId: !GetAtt DataKey.Arn
      PerformanceInsightsRetentionPeriod: 7
      Port: 5432
      PreferredBackupWindow: 07:00-07:30
      PreferredMaintenanceWindow: sun:08:00-sun:09:00
      PubliclyAccessible: false
      StorageEncrypted: true
      StorageType: gp3
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      Tags:
        - Key: application
          Value: payshield
        - Key: environment
          Value: !Ref EnvironmentName

  CoreRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey: !GetAtt DataKey.Arn
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Retain the newest 40 release images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 40
                },
                "action": { "type": "expire" }
              }
            ]
          }
      RepositoryName: !Sub payshield-${EnvironmentName}-core

  CoreLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      KmsKeyId: !GetAtt DataKey.Arn
      LogGroupName: !Sub /payshield/${EnvironmentName}/core
      RetentionInDays: 90

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub payshield-${EnvironmentName}-task-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadRuntimeSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref CoreServiceTokenSecret
                  - !Ref TokenVaultEncryptionSecret
                  - !Ref TokenVaultWebhookSecret
                  - !Ref ProviderWebhookSecret
                  - !GetAtt LedgerDatabase.MasterUserSecret.SecretArn
                  - !If [HasPlaidClientIdSecret, !Ref PlaidClientIdSecretArn, !Ref "AWS::NoValue"]
                  - !If [HasPlaidSecret, !Ref PlaidSecretArn, !Ref "AWS::NoValue"]
                  - !If [HasBaasApiKeySecret, !Ref BaasApiKeySecretArn, !Ref "AWS::NoValue"]
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !GetAtt DataKey.Arn
      Tags:
        - Key: application
          Value: payshield
        - Key: environment
          Value: !Ref EnvironmentName

  CoreTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub payshield-${EnvironmentName}-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: application
          Value: payshield
        - Key: environment
          Value: !Ref EnvironmentName

  CoreCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub payshield-${EnvironmentName}-core
      CapacityProviders: [FARGATE, FARGATE_SPOT]
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  CoreTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Cpu: "512"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      Family: !Sub payshield-${EnvironmentName}-core
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      TaskRoleArn: !GetAtt CoreTaskRole.Arn
      ContainerDefinitions:
        - Name: payshield-core
          Image: !Sub ${CoreRepository.RepositoryUri}:${ContainerImageTag}
          Essential: true
          LinuxParameters:
            Capabilities:
              Drop: [ALL]
            InitProcessEnabled: true
          PortMappings:
            - ContainerPort: 8080
              Name: http
              Protocol: tcp
          ReadonlyRootFilesystem: true
          StopTimeout: 30
          HealthCheck:
            Command: [CMD-SHELL, "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
            Interval: 30
            Retries: 3
            StartPeriod: 30
            Timeout: 5
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PAYSHIELD_CORE_PORT
              Value: "8080"
            - Name: PAYSHIELD_CORE_API_URL
              Value: !Sub https://${CoreDomainName}
            - Name: PAYSHIELD_CORE_REQUIRE_SERVICE_TOKEN
              Value: "true"
            - Name: PAYSHIELD_CORE_REQUIRE_DURABLE_STORAGE
              Value: "true"
            - Name: PAYSHIELD_FRONTEND_AUTH_VERIFIED
              Value: !Ref FrontendAuthVerified
            - Name: PAYSHIELD_LEDGER_SCHEMA_VERIFIED
              Value: "true"
            - Name: PAYSHIELD_LEDGER_SCHEMA_VERIFIED_VERSION
              Value: "0019"
            - Name: PAYSHIELD_LEDGER_SCHEMA_FINGERPRINT
              Value: !Ref LedgerSchemaFingerprint
            - Name: PAYSHIELD_CORE_DB_POOL_SIZE
              Value: "10"
            - Name: PAYSHIELD_CORE_DB_CONNECT_TIMEOUT_MS
              Value: "5000"
            - Name: PAYSHIELD_CORE_DB_IDLE_TIMEOUT_MS
              Value: "30000"
            - Name: PGHOST
              Value: !GetAtt LedgerDatabase.Endpoint.Address
            - Name: PGPORT
              Value: !GetAtt LedgerDatabase.Endpoint.Port
            - Name: PGDATABASE
              Value: !Ref DatabaseName
            - Name: PGSSLMODE
              Value: require
            - Name: PAYSHIELD_BAAS_PROVIDER
              Value: !Ref BaasProvider
            - Name: PAYSHIELD_BAAS_ADAPTER
              Value: http_json
            - Name: PAYSHIELD_BAAS_API_BASE_URL
              Value: !Ref BaasApiBaseUrl
            - Name: PAYSHIELD_BAAS_CONTRACT_APPROVED
              Value: !Ref BaasContractApproved
            - Name: PAYSHIELD_SPONSOR_DISCLOSURES_APPROVED
              Value: !Ref SponsorDisclosuresApproved
            - Name: PAYSHIELD_REGULATED_COUNSEL_SIGNOFF
              Value: !Ref RegulatedCounselSignoff
            - Name: PAYSHIELD_OPERATIONS_RUNBOOKS_APPROVED
              Value: !Ref OperationsRunbooksApproved
            - Name: PAYSHIELD_TRANSFER_ENABLED
              Value: !Ref TransferEnabled
            - Name: PAYSHIELD_LIVE_MONEY_ENABLED
              Value: !Ref LiveMoneyEnabled
            - Name: PLAID_ENV
              Value: !Ref PlaidEnvironment
            - Name: PLAID_PRODUCTS
              Value: auth,transactions
            - Name: PLAID_COUNTRY_CODES
              Value: US
            - Name: PLAID_WEBHOOK_URL
              Value: !Sub https://${CoreDomainName}/api/plaid/webhooks
            - Name: PAYSHIELD_PLAID_SYNC_WORKER_ENABLED
              Value: "true"
            - Name: PAYSHIELD_PLAID_SYNC_WORKER_INTERVAL_MS
              Value: "5000"
            - Name: PAYSHIELD_TOKEN_VAULT_KEY_ID
              Value: !Sub payshield-${EnvironmentName}-token-v1
            - Name: PAYSHIELD_TOKEN_VAULT_WEBHOOK_URL
              Value: !Sub https://${CoreDomainName}/api/token-vault/plaid
          Secrets:
            - Name: PGUSER
              ValueFrom: !Join [":", [!GetAtt LedgerDatabase.MasterUserSecret.SecretArn, username, "", ""]]
            - Name: PGPASSWORD
              ValueFrom: !Join [":", [!GetAtt LedgerDatabase.MasterUserSecret.SecretArn, password, "", ""]]
            - Name: PAYSHIELD_CORE_SERVICE_TOKEN
              ValueFrom: !Ref CoreServiceTokenSecret
            - Name: PAYSHIELD_TOKEN_VAULT_ENCRYPTION_KEY
              ValueFrom: !Ref TokenVaultEncryptionSecret
            - Name: PAYSHIELD_TOKEN_VAULT_WEBHOOK_SECRET
              ValueFrom: !Ref TokenVaultWebhookSecret
            - Name: PAYSHIELD_PROVIDER_WEBHOOK_SECRET
              ValueFrom: !Ref ProviderWebhookSecret
            - !If
              - HasPlaidClientIdSecret
              - Name: PLAID_CLIENT_ID
                ValueFrom: !Ref PlaidClientIdSecretArn
              - !Ref "AWS::NoValue"
            - !If
              - HasPlaidSecret
              - Name: PLAID_SECRET
                ValueFrom: !Ref PlaidSecretArn
              - !Ref "AWS::NoValue"
            - !If
              - HasBaasApiKeySecret
              - Name: PAYSHIELD_BAAS_API_KEY
                ValueFrom: !Ref BaasApiKeySecretArn
              - !Ref "AWS::NoValue"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref CoreLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: core
              mode: non-blocking
              max-buffer-size: 25m
          MountPoints: []
          SystemControls: []
          VolumesFrom: []
      Volumes: []

  AlbAccessLogsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-load-balancer-logs
            Status: Enabled
            ExpirationInDays: 365
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  AlbAccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AlbAccessLogsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowLoadBalancerLogDelivery
            Effect: Allow
            Principal:
              Service: logdelivery.elasticloadbalancing.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${AlbAccessLogsBucket.Arn}/AWSLogs/${AWS::AccountId}/*

  CoreLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: AlbAccessLogsBucketPolicy
    Properties:
      IpAddressType: ipv4
      Scheme: internet-facing
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      Type: application
      LoadBalancerAttributes:
        - Key: deletion_protection.enabled
          Value: "true"
        - Key: access_logs.s3.enabled
          Value: "true"
        - Key: access_logs.s3.bucket
          Value: !Ref AlbAccessLogsBucket
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        - Key: routing.http.desync_mitigation_mode
          Value: strictest

  CoreTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      Matcher:
        HttpCode: "200"
      Port: 8080
      Protocol: HTTP
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
        - Key: slow_start.duration_seconds
          Value: "30"
      TargetType: ip
      UnhealthyThresholdCount: 3
      VpcId: !Ref CoreVpc

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301
      LoadBalancerArn: !Ref CoreLoadBalancer
      Port: 80
      Protocol: HTTP

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref CoreTargetGroup
      LoadBalancerArn: !Ref CoreLoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06

  CoreDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasHostedZone
    Properties:
      AliasTarget:
        DNSName: !GetAtt CoreLoadBalancer.DNSName
        EvaluateTargetHealth: true
        HostedZoneId: !GetAtt CoreLoadBalancer.CanonicalHostedZoneID
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref CoreDomainName
      Type: A

  CoreWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      DefaultAction:
        Allow: {}
      Description: PayShield core managed protections and request rate control
      Scope: REGIONAL
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub payshield-${EnvironmentName}-core
        SampledRequestsEnabled: true
      Rules:
        - Name: PerIpRateLimit
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              Limit: 2000
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: per-ip-rate-limit
            SampledRequestsEnabled: true
        - Name: AwsCommonRules
          Priority: 10
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              Name: AWSManagedRulesCommonRuleSet
              VendorName: AWS
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: aws-common-rules
            SampledRequestsEnabled: true
        - Name: AwsKnownBadInputs
          Priority: 20
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              Name: AWSManagedRulesKnownBadInputsRuleSet
              VendorName: AWS
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: aws-known-bad-inputs
            SampledRequestsEnabled: true
        - Name: AwsIpReputation
          Priority: 30
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              Name: AWSManagedRulesAmazonIpReputationList
              VendorName: AWS
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: aws-ip-reputation
            SampledRequestsEnabled: true

  CoreWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref CoreLoadBalancer
      WebACLArn: !GetAtt CoreWebAcl.Arn

  CoreService:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      Cluster: !Ref CoreCluster
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      DesiredCount: !Ref DesiredCount
      EnableECSManagedTags: true
      HealthCheckGracePeriodSeconds: 60
      LaunchType: FARGATE
      LoadBalancers:
        - ContainerName: payshield-core
          ContainerPort: 8080
          TargetGroupArn: !Ref CoreTargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!Ref AppSecurityGroup]
          Subnets: [!Ref AppSubnetA, !Ref AppSubnetB]
      PlatformVersion: 1.4.0
      PropagateTags: SERVICE
      ServiceName: !Sub payshield-${EnvironmentName}-core
      TaskDefinition: !Ref CoreTaskDefinition

  CoreScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 8
      MinCapacity: !Ref DesiredCount
      ResourceId: !Join ["/", [service, !Ref CoreCluster, !GetAtt CoreService.Name]]
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  CoreCpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub payshield-${EnvironmentName}-cpu
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref CoreScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleInCooldown: 120
        ScaleOutCooldown: 60
        TargetValue: 60

  CoreMemoryScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub payshield-${EnvironmentName}-memory
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref CoreScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageMemoryUtilization
        ScaleInCooldown: 120
        ScaleOutCooldown: 60
        TargetValue: 70

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      KmsMasterKeyId: alias/aws/sns
      Subscription:
        - Endpoint: !Ref AlertEmail
          Protocol: email

  LoadBalancerFiveXxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions: [!Ref AlertTopic]
      AlarmDescription: PayShield core load balancer is returning 5xx responses.
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt CoreLoadBalancer.LoadBalancerFullName
      EvaluationPeriods: 2
      MetricName: HTTPCode_ELB_5XX_Count
      Namespace: AWS/ApplicationELB
      Period: 60
      Statistic: Sum
      Threshold: 5
      TreatMissingData: notBreaching

  UnhealthyTargetAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions: [!Ref AlertTopic]
      AlarmDescription: PayShield core has an unhealthy ECS target.
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt CoreLoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt CoreTargetGroup.TargetGroupFullName
      EvaluationPeriods: 2
      MetricName: UnHealthyHostCount
      Namespace: AWS/ApplicationELB
      Period: 60
      Statistic: Maximum
      Threshold: 0
      TreatMissingData: breaching

  DatabaseCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions: [!Ref AlertTopic]
      AlarmDescription: PayShield ledger database CPU is sustained above 80 percent.
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref LedgerDatabase
      EvaluationPeriods: 5
      MetricName: CPUUtilization
      Namespace: AWS/RDS
      Period: 60
      Statistic: Average
      Threshold: 80
      TreatMissingData: notBreaching

  DatabaseStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions: [!Ref AlertTopic]
      AlarmDescription: PayShield ledger database has less than 10 GiB free storage.
      ComparisonOperator: LessThanThreshold
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref LedgerDatabase
      EvaluationPeriods: 2
      MetricName: FreeStorageSpace
      Namespace: AWS/RDS
      Period: 300
      Statistic: Average
      Threshold: 10737418240
      TreatMissingData: missing

Outputs:
  CoreApiUrl:
    Value: !Sub https://${CoreDomainName}
  CoreRepositoryUri:
    Value: !GetAtt CoreRepository.RepositoryUri
  CoreClusterName:
    Value: !Ref CoreCluster
  CoreServiceName:
    Value: !GetAtt CoreService.Name
  CoreTaskDefinitionArn:
    Value: !Ref CoreTaskDefinition
  AppSubnetIds:
    Value: !Join [",", [!Ref AppSubnetA, !Ref AppSubnetB]]
  AppSecurityGroupId:
    Value: !Ref AppSecurityGroup
  CoreServiceTokenSecretArn:
    Value: !Ref CoreServiceTokenSecret
  ProviderWebhookSecretArn:
    Value: !Ref ProviderWebhookSecret
  DatabaseSecretArn:
    Value: !GetAtt LedgerDatabase.MasterUserSecret.SecretArn
  DatabaseEndpoint:
    Value: !GetAtt LedgerDatabase.Endpoint.Address
  LoadBalancerDnsName:
    Value: !GetAtt CoreLoadBalancer.DNSName
  LoadBalancerCanonicalHostedZoneId:
    Value: !GetAtt CoreLoadBalancer.CanonicalHostedZoneID
