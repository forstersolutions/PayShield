AWSTemplateFormatVersion: "2010-09-09"
Description: Short-lived GitHub Actions deployment roles for the PayShield production core.

Parameters:
  GitHubOidcProviderArn:
    Type: String
    Description: ARN of the account GitHub Actions OIDC provider.
  GitHubOrganization:
    Type: String
    Default: forstersolutions
  GitHubRepository:
    Type: String
    Default: PayShield
  GitHubEnvironment:
    Type: String
    Default: Production
  CoreStackName:
    Type: String
    Default: payshield-production-core

Resources:
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: payshield-production-cloudformation
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PayShieldCoreResources
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageCoreInfrastructure
                Effect: Allow
                Action:
                  - application-autoscaling:*
                  - cloudwatch:*
                  - ec2:*
                  - ecr:*
                  - ecs:*
                  - elasticloadbalancing:*
                  - kms:*
                  - logs:*
                  - rds:*
                  - s3:*
                  - secretsmanager:*
                  - sns:*
                  - wafv2:*
                Resource: "*"
              - Sid: ManageCoreDnsRecord
                Effect: Allow
                Action:
                  - route53:ChangeResourceRecordSets
                  - route53:GetChange
                  - route53:GetHostedZone
                  - route53:ListResourceRecordSets
                Resource: "*"
              - Sid: ManageNamedCoreRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                  - iam:ListRoleTags
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/payshield-production-database-monitoring
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/payshield-production-task
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/payshield-production-task-execution
              - Sid: AttachApprovedManagedPolicies
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/payshield-production-database-monitoring
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/payshield-production-task-execution
                Condition:
                  ArnEquals:
                    iam:PolicyARN:
                      - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
                      - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole
              - Sid: CreateRequiredServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"
                Condition:
                  StringEquals:
                    iam:AWSServiceName:
                      - application-autoscaling.amazonaws.com
                      - ecs.amazonaws.com
                      - elasticloadbalancing.amazonaws.com
                      - rds.amazonaws.com
      Tags:
        - Key: application
          Value: payshield
        - Key: environment
          Value: production

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: payshield-production-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrganization}/${GitHubRepository}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: PayShieldProductionDeploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ValidateTemplates
                Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: "*"
              - Sid: ManageOnlyPayShieldCoreStack
                Effect: Allow
                Action: cloudformation:*
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${CoreStackName}/*
              - Sid: PassCloudFormationExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: AuthenticateToEcr
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PublishCoreImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:ListImages
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/payshield-production-core
              - Sid: RunAndVerifyCoreTasks
                Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                  - ecs:RunTask
                Resource: "*"
                Condition:
                  ArnEquals:
                    ecs:cluster: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/payshield-production-core
              - Sid: PassCoreTaskRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/payshield-production-task
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/payshield-production-task-execution
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Sid: ReadCoreServiceToken
                Effect: Allow
                Action:
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:payshield/production/core-service-token-*
              - Sid: DecryptCoreServiceToken
                Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  ForAnyValue:StringEquals:
                    kms:ResourceAliases: alias/payshield-production
      Tags:
        - Key: application
          Value: payshield
        - Key: environment
          Value: production

Outputs:
  CloudFormationExecutionRoleArn:
    Value: !GetAtt CloudFormationExecutionRole.Arn
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
