name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Next.js app
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify market site
        run: npm run verify

      - name: Smoke core service image
        run: npm run core:docker:smoke

      - name: Smoke waitlist receiver image
        run: npm run receiver:docker:smoke

      - name: Validate waitlist receiver compose manifest
        run: npm run receiver:compose:config
