name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Next.js app
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: payshield_test
          POSTGRES_PASSWORD: payshield_test
          POSTGRES_USER: payshield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payshield_test -d payshield_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Install website dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm ci --prefix apps/mobile

      - name: Install release browser
        run: npx playwright install --with-deps chromium

      - name: Verify release application
        run: npm run verify

      - name: Verify migrations and ledger against PostgreSQL
        env:
          PAYSHIELD_LEDGER_DATABASE_URL: postgresql://payshield_test:payshield_test@127.0.0.1:5432/payshield_test
          PAYSHIELD_TEST_DATABASE_URL: postgresql://payshield_test:payshield_test@127.0.0.1:5432/payshield_test
        run: |
          npm run core:migrations:apply
          npm run core:migrations:verify
          node --experimental-strip-types --test tests/core-postgres-integration.test.mts

      - name: Smoke core service image
        run: npm run core:docker:smoke

      - name: Validate core compose manifest
        run: npm run core:compose:config
