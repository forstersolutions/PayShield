name: Paid Traffic Readiness
description: Track the remaining operational gates before broad or paid acquisition.
title: "Paid traffic readiness: "
body:
  - type: markdown
    attributes:
      value: |
        Use this issue before paid acquisition, broad public launch, or any campaign that depends on durable lead capture.
  - type: input
    id: production-url
    attributes:
      label: Production URL
      placeholder: https://payshield-lime.vercel.app
    validations:
      required: true
  - type: checkboxes
    id: lead-capture
    attributes:
      label: Lead Capture Gates
      options:
        - label: "`npm run lead-capture:dry-run` passes locally and the non-PII output is attached."
        - label: "`npm run receiver:docker:smoke` passes in CI or locally if the lightweight receiver will be used."
        - label: "`npm run receiver:compose:config` passes if `compose.receiver.yml` will be used."
        - label: "`npm run market:evidence:init -- --dir launch-evidence --site-url https://payshield-lime.vercel.app --receiver-url https://your-webhook-url --data-dir /path/to/waitlist --backup-dir /secure/path` creates the ignored local evidence packet."
        - label: Receiver selected and owned by the launch operator.
        - label: "`compose.receiver.yml` is used or an equivalent persistent-volume receiver deployment is documented if the lightweight receiver is used."
        - label: "`PAYSHIELD_WAITLIST_WEBHOOK_SECRET=... npm run receiver:evidence -- --url https://your-webhook-url --data-dir /path/to/waitlist --backup-dir /secure/path` passes and the redacted output is attached if the lightweight receiver is used."
        - label: "`npm run receiver:managed:check -- --file launch-evidence/receiver-evidence.json` passes and the redacted output is attached if a managed receiver or CRM is used."
        - label: "Receiver accepts `npm run webhook:test -- https://your-webhook-url --replay`."
        - label: "`PAYSHIELD_WAITLIST_WEBHOOK_URL` is configured in Vercel Production."
        - label: "`PAYSHIELD_WAITLIST_WEBHOOK_SECRET` is configured in Vercel Production."
        - label: "`PAYSHIELD_WAITLIST_STORAGE=blob` and `BLOB_READ_WRITE_TOKEN` are configured in Vercel Production if Vercel-native Blob capture is used."
        - label: "`PAYSHIELD_WAITLIST_STORAGE=upstash`, `UPSTASH_REDIS_REST_URL`, and `UPSTASH_REDIS_REST_TOKEN` are configured in Vercel Production if Vercel-native Upstash capture is used."
        - label: "`PAYSHIELD_REQUIRE_WAITLIST_WEBHOOK=true` is configured in Vercel Production."
        - label: "`PAYSHIELD_WAITLIST_WEBHOOK_SECRET=... npm run vercel:webhook:cutover -- --site-url https://payshield-lime.vercel.app --receiver-evidence-file launch-evidence/receiver-evidence.json` prints the redacted Production env, redeploy, strict evidence, and required-webhook smoke sequence."
        - label: "`UPSTASH_REDIS_REST_URL=... UPSTASH_REDIS_REST_TOKEN=... npm run vercel:upstash:cutover -- --site-url https://payshield-lime.vercel.app --receiver-evidence-file launch-evidence/receiver-evidence.json --apply-env` applies or prints the redacted Production env, redeploy, strict evidence, required-capture smoke, and Upstash evidence sequence if Vercel-native Upstash capture is used."
        - label: "`npm run vercel:env:audit` passes for Production."
        - label: "`npm run launch:evidence -- https://payshield-lime.vercel.app --expect-site-url https://payshield-lime.vercel.app --strict` passes."
        - label: "`UPSTASH_REDIS_REST_URL=... UPSTASH_REDIS_REST_TOKEN=... npm run receiver:upstash:evidence -- https://payshield-lime.vercel.app --site-url https://payshield-lime.vercel.app --reviewer \"Launch operator\" --storage-owner \"Revenue operations\" --deletion-process-documented --export-process-documented --output launch-evidence/receiver-evidence.json` passes and the redacted output is attached if Vercel-native Upstash capture is used."
        - label: "`npm run receiver:upstash:check -- --file launch-evidence/receiver-evidence.json` passes and the redacted output is attached if Vercel-native Upstash capture is used."
        - label: "`BLOB_READ_WRITE_TOKEN=... npm run receiver:blob:evidence -- https://payshield-lime.vercel.app --site-url https://payshield-lime.vercel.app --reviewer \"Launch operator\" --storage-owner \"Revenue operations\" --deletion-process-documented --export-process-documented --output launch-evidence/receiver-evidence.json` passes and the redacted output is attached if Vercel-native Blob capture is used."
        - label: "`npm run receiver:blob:check -- --file launch-evidence/receiver-evidence.json` passes and the redacted output is attached if Vercel-native Blob capture is used."
        - label: "`npm run market:go-no-go -- https://payshield-lime.vercel.app --expect-site-url https://payshield-lime.vercel.app --receiver-evidence-file launch-evidence/receiver-evidence.json --counsel-signoff-file launch-evidence/counsel-signoff.json --analytics-evidence-file launch-evidence/analytics-evidence.json` passes and the redacted output is attached."
        - label: "`/api/health` reports `waitlist.webhookSigningConfigured: true`."
        - label: "`/api/health` reports `waitlist.storageConfigured: true` if Vercel-native Blob or Upstash capture is used."
        - label: "`/api/health` reports `waitlist.paidTrafficReady: true`."
        - label: "`npm run smoke:deploy -- https://payshield-lime.vercel.app --expect-site-url https://payshield-lime.vercel.app --submit-test --require-webhook` passes."
        - label: "Receiver stores `consentVersion`, `privacyVersion`, `termsVersion`, `consentedAt`, and `consentText` for accepted test leads."
        - label: "Receiver stores `submissionId` and treats signed replays with the same `submissionId` as idempotent."
        - label: "A signed test submission with `utm_source`, `utm_medium`, and `utm_campaign` persists sanitized `attribution` fields."
        - label: "`npm run waitlist:data -- audit --data-dir /path/to/waitlist` passes without printing PII if the lightweight receiver is used."
        - label: "`npm run waitlist:data -- backup --data-dir /path/to/waitlist --backup-dir /secure/path` creates a protected export if the lightweight receiver is used."
        - label: "`npm run waitlist:data -- verify-backup --backup-path /secure/path/waitlist-backup-...` confirms manifest hashes if the lightweight receiver is used."
  - type: checkboxes
    id: market-compliance
    attributes:
      label: Market And Compliance Gates
      options:
        - label: Privacy Notice reviewed for the current campaign.
        - label: Terms reviewed for the current campaign.
        - label: Privacy Notice discloses UTM attribution, Vercel Web Analytics, Speed Insights, and the analytics PII boundary.
        - label: Public copy does not claim PayShield is a bank.
        - label: Public copy does not claim FDIC insurance or sponsor-bank coverage.
        - label: No live money movement, account opening, ACH, card issuing, or bill-pay promises are used in campaign copy.
        - label: "`npm run campaign:lint -- path/to/campaign-copy.md` passes for every campaign draft."
        - label: "`npm run campaign:lint:all` passes against `docs/campaigns/manifest.json` and the redacted output is attached."
        - label: "`npm run legal:lint` passes and `docs/legal-review-packet.md` is attached for counsel review."
        - label: "`npm run counsel:signoff:check -- --file launch-evidence/counsel-signoff.json` passes and the redacted output is attached after counsel review."
        - label: Counsel has reviewed the launch surface before regulated financial-service claims or live funds.
  - type: checkboxes
    id: production-ops
    attributes:
      label: Production Operations Gates
      options:
        - label: Production deployment is on the intended `main` commit.
        - label: "`npm run analytics:audit` passes and the redacted output is attached."
        - label: Vercel Web Analytics is enabled and receiving non-PII conversion events with sanitized campaign metadata.
        - label: Vercel Speed Insights is enabled and receiving page data.
        - label: "`npm run analytics:evidence:check -- --file launch-evidence/analytics-evidence.json --site-url https://payshield-lime.vercel.app` passes and the redacted output is attached."
        - label: "`/.well-known/security.txt` links to private GitHub vulnerability reporting and the repository security policy."
        - label: Default scaffold assets such as `/next.svg` and `/vercel.svg` are not publicly served.
        - label: Custom domain, `NEXT_PUBLIC_SITE_URL`, canonical metadata, robots, and sitemap match if a custom domain is used.
        - label: GitHub CI passes on the launch commit.
        - label: "`npm run market:status -- https://payshield-lime.vercel.app --expect-site-url https://payshield-lime.vercel.app` passes and the redacted status snapshot is attached."
        - label: GitHub Dependabot security updates, secret scanning, and push protection are enabled.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Paste command output, health JSON, Vercel deployment URL, CI run URL, legal review note, and receiver test result.
      placeholder: |
        /api/health:
        smoke:deploy:
        receiver:managed:check:
        receiver:blob:evidence:
        receiver:blob:check:
        receiver:upstash:evidence:
        receiver:upstash:check:
        vercel:upstash:cutover:
        vercel:webhook:cutover:
        counsel:signoff:check:
        analytics:evidence:check:
        market:go-no-go:
        market:status:
        Vercel deployment:
        CI run:
        Legal/counsel review:
    validations:
      required: true
