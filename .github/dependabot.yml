version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    ignore:
      # Keep launch maintenance to patch/minor updates. Major upgrades should be
      # planned intentionally after the market prototype is deployed.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      next-runtime:
        patterns:
          - "next"
          - "react"
          - "react-dom"
      vercel-observability:
        patterns:
          - "@vercel/analytics"
          - "@vercel/speed-insights"
      lint-and-types:
        patterns:
          - "eslint"
          - "eslint-config-next"
          - "typescript"
          - "@types/*"
          - "@tailwindcss/*"
          - "tailwindcss"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
