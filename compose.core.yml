services:
  payshield-core:
    build:
      context: .
      dockerfile: Dockerfile.core
    environment:
      PAYSHIELD_CORE_PORT: 8080
      PAYSHIELD_LIVE_MONEY_ENABLED: ${PAYSHIELD_LIVE_MONEY_ENABLED:-false}
      PAYSHIELD_LEDGER_DATABASE_URL: ${PAYSHIELD_LEDGER_DATABASE_URL:-}
      PAYSHIELD_BAAS_PROVIDER: ${PAYSHIELD_BAAS_PROVIDER:-}
      PAYSHIELD_BAAS_API_KEY: ${PAYSHIELD_BAAS_API_KEY:-}
      PAYSHIELD_BAAS_CONTRACT_APPROVED: ${PAYSHIELD_BAAS_CONTRACT_APPROVED:-false}
      PAYSHIELD_SPONSOR_DISCLOSURES_APPROVED: ${PAYSHIELD_SPONSOR_DISCLOSURES_APPROVED:-false}
      PAYSHIELD_REGULATED_COUNSEL_SIGNOFF: ${PAYSHIELD_REGULATED_COUNSEL_SIGNOFF:-false}
      PAYSHIELD_OPERATIONS_RUNBOOKS_APPROVED: ${PAYSHIELD_OPERATIONS_RUNBOOKS_APPROVED:-false}
    ports:
      - "${PAYSHIELD_CORE_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
